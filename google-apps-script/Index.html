<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapaklı Tenis Akademi</title>
<style>
/* =====================================================================
   Kapaklı Tenis Akademi — tek dosya arayüz (Google Apps Script)
   Koyu cam (glassmorphism) tema · Sunucu: Kod.gs → api()
   ===================================================================== */
:root { color-scheme: dark; --lime: #d9f99d; --lime-d: #1a2e05; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #06110d; color: #fff; font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 0; text-shadow: 0 2px 16px rgba(0,0,0,.45); }
h2 { font-size: 14px; font-weight: 600; margin: 0; }
.hidden { display: none !important; }
.muted { color: rgba(255,255,255,.68); } .dim { color: rgba(255,255,255,.6); } .small { font-size: 12px; } .xs { font-size: 11px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.b { font-weight: 600; } .right { text-align: right; } .nowrap { white-space: nowrap; } .pre { white-space: pre-line; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 12px; } .stack-lg > * + * { margin-top: 22px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g7 { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; }
.mb { margin-bottom: 18px; } .mt { margin-top: 14px; } .mt-s { margin-top: 6px; }

/* ---------- cam yüzeyler */
.glass { background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 12px 36px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); }
.card { min-width: 0; border-radius: 18px; background: linear-gradient(135deg, rgba(14,30,25,.74), rgba(10,22,18,.6)); border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 14px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.12); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
.card-b { padding: 16px; } .card-b.flush { padding: 0; }
.tile { position: relative; overflow: hidden; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; min-height: 132px;
  border: 1px solid rgba(255,255,255,.22); box-shadow: 0 14px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); transition: transform .15s; }
a.tile:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.4); }
.t-blue { background: linear-gradient(145deg, rgba(96,165,250,.62), rgba(96,165,250,.28) 55%, rgba(12,24,20,.55)); }
.t-purple { background: linear-gradient(145deg, rgba(167,139,250,.62), rgba(167,139,250,.28) 55%, rgba(12,24,20,.55)); }
.t-gold { background: linear-gradient(145deg, rgba(250,204,21,.62), rgba(250,204,21,.28) 55%, rgba(12,24,20,.55)); }
.t-green { background: linear-gradient(145deg, rgba(74,222,128,.58), rgba(74,222,128,.26) 55%, rgba(12,24,20,.55)); }
.t-red { background: linear-gradient(145deg, rgba(248,113,113,.62), rgba(248,113,113,.28) 55%, rgba(12,24,20,.55)); }
.tile .ico { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
.tile .lbl { font-size: 13px; font-weight: 600; padding-right: 48px; line-height: 1.3; }
.tile .val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; line-height: 1.15; }
.tile .hint { margin-top: auto; padding-top: 10px; font-size: 12px; color: rgba(255,255,255,.78); }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.2); margin-top: 10px; overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 99px; background: #fff; }

/* ---------- form ve düğmeler */
.input { display: block; width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1); color: #fff; padding: 9px 12px; font: inherit; font-size: 14px; outline: none; }
.input:focus { border-color: #bef264; box-shadow: 0 0 0 3px rgba(190,242,100,.25); }
.input::placeholder { color: rgba(255,255,255,.5); }
select.input option { background: #10241d; color: #fff; }
textarea.input { resize: vertical; min-height: 64px; }
.label { display: block; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.72); margin-bottom: 5px; }
.field { display: block; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; } .check input { width: 17px; height: 17px; accent-color: #a3e635; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600; border: 1px solid transparent; transition: .15s; white-space: nowrap; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-p { background: var(--lime); color: var(--lime-d); box-shadow: 0 6px 20px rgba(190,242,100,.25); } .btn-p:hover { background: #ecfccb; }
.btn-s { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; } .btn-s:hover { background: rgba(255,255,255,.2); }
.btn-d { background: rgba(239,68,68,.1); border-color: rgba(248,113,113,.4); color: #fecaca; } .btn-d:hover { background: rgba(239,68,68,.25); }
.btn-sm { padding: 4px 12px; font-size: 12px; } .btn-w { width: 100%; }
.link { color: #d9f99d; font-weight: 500; cursor: pointer; } .link:hover { text-decoration: underline; }
.msg { margin: 12px 0 0; border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.msg.err { background: rgba(239,68,68,.15); color: #fca5a5; } .msg.ok { background: rgba(190,242,100,.15); color: #ecfccb; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; overflow: hidden; }
.seg label { cursor: pointer; } .seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 6px 12px; min-width: 42px; text-align: center; font-size: 13px; }
.seg input:checked + span { color: #fff; background: #24663f; } .seg input.no:checked + span { background: #dc2626; } .seg input.ex:checked + span { background: #f59e0b; color: #1c1917; }
.seg input:focus-visible + span { outline: 2px solid #bef264; outline-offset: -2px; }

/* ---------- rozet */
.badge { display: inline-flex; align-items: center; white-space: nowrap; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--r); background: var(--bg); color: var(--fg); }
.b-green { --bg: rgba(190,242,100,.15); --fg: #d9f99d; --r: rgba(190,242,100,.3); } .b-red { --bg: rgba(239,68,68,.15); --fg: #fca5a5; --r: rgba(248,113,113,.3); }
.b-amber { --bg: rgba(251,191,36,.15); --fg: #fde68a; --r: rgba(252,211,77,.3); } .b-clay { --bg: rgba(251,146,60,.15); --fg: #fed7aa; --r: rgba(253,186,116,.3); }
.b-gray { --bg: rgba(255,255,255,.1); --fg: rgba(255,255,255,.78); --r: rgba(255,255,255,.2); } .b-blue { --bg: rgba(56,189,248,.15); --fg: #bae6fd; --r: rgba(125,211,252,.3); }

/* ---------- tablolar (telefonda kart) */
.tw { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.62); padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
.table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; } .table tbody tr:hover { background: rgba(255,255,255,.04); }
.list-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.list-row:last-child { border-bottom: 0; }
.empty { text-align: center; padding: 26px 10px; color: rgba(255,255,255,.65); font-size: 14px; }

/* ---------- üst menü */
header.top { position: sticky; top: 0; z-index: 30; padding: 12px 20px 4px; background: linear-gradient(to bottom, #03080c, rgba(3,8,12,.7) 60%, transparent); }
.topbar { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; padding: 8px 12px; border-radius: 999px; background-color: rgba(8,20,15,.6); }
.brand { display: flex; align-items: center; gap: 10px; flex: none; padding-right: 8px; cursor: pointer; }
.brand img { width: 36px; height: 36px; border-radius: 50%; } .brand b { display: block; font-size: 14px; line-height: 1.1; } .brand small { display: block; font-size: 11px; color: rgba(255,255,255,.7); }
nav.pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 auto; }
nav.pills::-webkit-scrollbar { display: none; }
.pill { display: flex; align-items: center; gap: 6px; flex: none; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.82); border: 1px solid transparent; cursor: pointer; }
.pill:hover { background: rgba(255,255,255,.1); color: #fff; }
.pill.on { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.35); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.acct { position: relative; flex: none; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #431407; background: linear-gradient(135deg, #fcd34d, #f97316); border: 0; box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
.avatar.ring { box-shadow: 0 0 0 2px #fff; }
.menu { position: absolute; right: 0; top: 46px; width: 240px; padding: 8px; background: rgba(12,28,23,.96) !important; z-index: 40; }
.menu .mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 8px; background: none; border: 0; text-align: left; font-size: 14px; color: rgba(255,255,255,.92); }
.menu .mi:hover { background: rgba(255,255,255,.1); } .menu .mi.on { background: rgba(255,255,255,.15); } .menu .mi.red { color: #fca5a5; }
.menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 4px 0; }
main { position: relative; z-index: 10; padding: 24px 20px 48px; } .wrap { max-width: 1400px; margin: 0 auto; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.ph p { margin: 4px 0 0; color: rgba(255,255,255,.7); font-size: 14px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 100; padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: 92vw; }
.toast.ok { background: #1f3d17; color: #ecfccb; border: 1px solid rgba(190,242,100,.4); } .toast.err { background: #45130f; color: #fecaca; border: 1px solid rgba(248,113,113,.4); }
.loading { display: grid; place-items: center; padding: 70px 0; color: rgba(255,255,255,.7); }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #d9f99d; animation: spin .8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- sahneler */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.login { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; overflow: hidden; background: #0f2d1c; }
.login .box { position: relative; z-index: 2; width: 100%; max-width: 384px; }
.login .head { text-align: center; margin-bottom: 24px; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.login .logo { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.2); }
@keyframes rollIn { 0% { transform: translate(55vmin,45vmin) rotate(260deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.4vmin) rotate(-3deg); } }
@keyframes drop { 0% { transform: translateY(-45vmin); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); } 10% { opacity: 1; }
  50% { transform: translateY(0) scale(1.08,.9); animation-timing-function: cubic-bezier(0,.55,.45,1); } 68% { transform: translateY(-9vmin); animation-timing-function: cubic-bezier(.55,0,1,.45); }
  82% { transform: translateY(0) scale(1.04,.95); animation-timing-function: cubic-bezier(0,.55,.45,1); } 91% { transform: translateY(-2.5vmin); animation-timing-function: cubic-bezier(.55,0,1,.45); } 100% { transform: none; opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.a-roll { animation: rollIn 1.5s cubic-bezier(.22,.8,.25,1) .1s both; } .a-float { animation: floaty 7s ease-in-out 1.7s infinite; }
.a-drop { animation: drop 1.3s .45s both; transform-origin: 50% 100%; } .a-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out both; }
.a-fade { animation: fadeIn .8s ease-out 1s both; } .a-rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) .25s both; } .a-rise2 { animation: rise .7s cubic-bezier(.2,.8,.2,1) .4s both; }
@media (prefers-reduced-motion: reduce) { .a-roll, .a-float, .a-drop, .a-fade, .a-rise, .a-rise2 { animation: none; } .a-draw { animation: none; stroke-dashoffset: 0; } }

/* ---------- haftalık program, kortlar, karne */
.day { display: flex; flex-direction: column; } .day.today { box-shadow: 0 0 0 2px rgba(190,242,100,.8); }
.ev { border-left: 4px solid; border-radius: 8px; padding: 6px 8px; font-size: 12px; margin-bottom: 8px; display: block; }
.ev-g { border-color: #bef264; background: rgba(190,242,100,.14); } .ev-p { border-color: #fb923c; background: rgba(251,146,60,.15); }
.ev-k { border-color: #38bdf8; background: rgba(56,189,248,.15); } .ev-w { border-color: #fbbf24; background: rgba(251,191,36,.15); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: rgba(255,255,255,.75); } .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.cgrid { width: 100%; min-width: 480px; table-layout: fixed; border-collapse: separate; border-spacing: 4px; font-size: 12px; }
.cell { height: 38px; border-radius: 6px; padding: 4px 6px; font-size: 11px; line-height: 1.25; overflow: hidden; }
.c-free { border: 1px dashed rgba(255,255,255,.18); color: rgba(255,255,255,.6); } .c-g { background: rgba(52,211,153,.2); color: #bbf7d0; }
.c-p { background: rgba(251,146,60,.22); color: #fed7aa; } .c-k { background: rgba(56,189,248,.22); color: #bae6fd; } .c-w { background: rgba(251,191,36,.22); color: #fde68a; }
.skill { display: grid; grid-template-columns: minmax(0,12rem) 1fr 5.5rem; gap: 12px; align-items: center; margin-bottom: 9px; }
.track { position: relative; height: 20px; } .track .grid5 { position: absolute; inset: 0; display: flex; justify-content: space-between; } .track .grid5 span { width: 1px; background: rgba(255,255,255,.1); }
.track .fill { position: absolute; top: 50%; height: 10px; transform: translateY(-50%); border-radius: 99px; background: linear-gradient(to right, #a3e635, #d9f99d); }
.track .prev { position: absolute; top: 0; height: 100%; width: 2px; background: rgba(255,255,255,.8); box-shadow: 0 0 0 2px #0d201a; }
.note { border-radius: 12px; background: rgba(255,255,255,.05); padding: 12px; }

/* ---------- duyarlılık */
@media (max-width: 1279px) {
  .topbar { flex-wrap: wrap; border-radius: 22px; } nav.pills { order: 3; width: 100%; margin: 0; }
  .acct { margin-left: auto; }
}
@media (max-width: 1100px) { .g5 { grid-template-columns: repeat(3, minmax(0,1fr)); } .g7 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 900px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .span2, .span3 { grid-column: auto; } .g2.lay { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  header.top { padding: 10px 10px 4px; } main { padding: 18px 12px 40px; } h1 { font-size: 23px; }
  .g2, .g3, .g5 { grid-template-columns: minmax(0,1fr); } .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; } .g7 { grid-template-columns: minmax(0,1fr); }
  .tile { padding: 14px; min-height: 118px; } .tile .val { font-size: 25px; } .tile .ico { width: 34px; height: 34px; right: 10px; top: 10px; } .tile .lbl { padding-right: 40px; }
  .card, .glass { -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .table thead { display: none; } .table, .table tbody { display: block; width: 100%; }
  .table tr { display: block; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .table td { display: flow-root; padding: 3px 0; border: 0; text-align: right; }
  .table td::before { content: attr(data-label); float: left; margin-right: 14px; max-width: 42%; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.6); padding-top: 2px; }
  .table td[data-label=""]::before { display: none; } .table td:first-child { display: block; text-align: left; font-size: 15px; padding-bottom: 6px; } .table td:first-child::before { display: none; }
  .table td > form, .table td > .row { display: inline-flex; justify-content: flex-end; }
  .skill { grid-template-columns: minmax(0,8rem) 1fr 4.5rem; }
  .list-row > .grow { flex-basis: calc(100% - 120px); }
  .check { min-height: 32px; }
}
/* =====================================================================
   3B CAM KATMANI — derinlik, ışık kenarı, parlama, eğilme
   ===================================================================== */
.wrap { perspective: 1600px; }
main { overflow-x: clip; } /* açılış animasyonunda yana kaydırma çubuğu çıkmasın */
/* daha şeffaf, daha yoğun bulanık cam + katmanlı gölge */
.card { position: relative; isolation: isolate; background: linear-gradient(150deg, rgba(255,255,255,.13), rgba(255,255,255,.04) 38%, rgba(6,18,14,.42) 100%), rgba(10,24,19,.38);
  border: 1px solid rgba(255,255,255,.1); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.4), inset 0 0 22px rgba(255,255,255,.035),
    0 2px 4px rgba(0,0,0,.18), 0 14px 28px rgba(0,0,0,.28), 0 34px 70px -18px rgba(0,0,0,.6); }
.card-h { border-bottom-color: rgba(255,255,255,.09); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.menu.card { position: absolute; } /* hesap menüsü açılır kalsın */
.glass { position: relative; isolation: isolate; background: linear-gradient(150deg, rgba(255,255,255,.18), rgba(255,255,255,.05) 45%, rgba(255,255,255,.02));
  -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%); border-color: rgba(255,255,255,.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35), 0 24px 60px -20px rgba(0,0,0,.6); }
/* ışık alan cam kenarı (sol üst parlak, sağ alt koyu) */
.card::before, .tile::before, .glass::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.2px; pointer-events: none; z-index: 2;
  background: linear-gradient(140deg, rgba(255,255,255,.7), rgba(255,255,255,.18) 22%, rgba(255,255,255,.04) 50%, rgba(255,255,255,.02) 70%, rgba(255,255,255,.28));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
/* fareyi izleyen parlama (içeriğin arkasında) */
.card::after, .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; transition: opacity .3s;
  background: radial-gradient(520px circle at var(--mx, 18%) var(--my, -10%), rgba(255,255,255,.12), transparent 45%); }
.tile::after { z-index: -1; background: radial-gradient(240px circle at var(--mx, 25%) var(--my, 0%), rgba(255,255,255,.16), transparent 60%),
  linear-gradient(170deg, rgba(255,255,255,.1), transparent 36%); }
/* renkli kutular: 3 boyutlu eğilme */
.t-blue, .t-purple, .t-gold, .t-green, .t-red { background-color: rgba(9,22,18,.82); }
.tile { isolation: isolate; border-color: rgba(255,255,255,.14); transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px));
  transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.25), inset 0 0 30px rgba(255,255,255,.06),
    0 3px 6px rgba(0,0,0,.2), 0 16px 32px rgba(0,0,0,.3), 0 36px 70px -20px rgba(0,0,0,.65); }
.tile .ico { position: absolute; transform: translate(calc(var(--tx, 0) * 7px), calc(var(--ty, 0) * 7px)); transition: transform .5s cubic-bezier(.2,.8,.2,1);
  background: linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,255,255,.1)); border: 1px solid rgba(255,255,255,.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 8px 18px rgba(0,0,0,.28); }
.tile .val { text-shadow: 0 2px 0 rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.35); }
.tile.tilting { transition: transform .12s ease-out, box-shadow .3s; }
.tile.tilting .ico { transition: transform .12s ease-out; }
a.tile:hover { --lift: -4px; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift)); border-color: rgba(255,255,255,.3);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.25), 0 6px 10px rgba(0,0,0,.22), 0 24px 44px rgba(0,0,0,.36), 0 50px 90px -24px rgba(0,0,0,.7); }
.bar { box-shadow: inset 0 1px 2px rgba(0,0,0,.35); } .bar i { background: linear-gradient(#fff, #e7ffd0); box-shadow: 0 0 12px rgba(255,255,255,.6); }
/* üst menü */
.topbar { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.4), 0 30px 60px -24px rgba(0,0,0,.7); }
.pill { transition: background .2s, box-shadow .2s, transform .2s; }
.pill:hover { transform: translateY(-1px); }
.pill.on { background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.1)); border-color: rgba(255,255,255,.3);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.brand img { box-shadow: 0 6px 14px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.25); }
.avatar { background: radial-gradient(circle at 32% 26%, #fef3c7, #fbbf24 30%, #f97316 62%, #9a3412); box-shadow: 0 0 0 2px rgba(255,255,255,.3), 0 6px 14px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.25); }
.avatar.ring { box-shadow: 0 0 0 2px #fff, 0 6px 14px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.25); }
/* düğmeler: basılabilir 3B */
.btn { transition: transform .12s, box-shadow .12s, background .2s, filter .2s; }
.btn-p { background: linear-gradient(180deg, #f7fee7, #d9f99d 45%, #a3e635); border-color: rgba(255,255,255,.6);
  box-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 rgba(63,98,18,.35), 0 3px 0 #4d7c0f, 0 10px 22px rgba(163,230,53,.32); }
.btn-p:hover { background: linear-gradient(180deg, #fff, #ecfccb 45%, #bef264); transform: translateY(-1px); box-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 rgba(63,98,18,.35), 0 4px 0 #4d7c0f, 0 14px 28px rgba(163,230,53,.4); }
.btn-s { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.06)); border-color: rgba(255,255,255,.22); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.25); }
.btn-s:hover { background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.1)); transform: translateY(-1px); }
.btn-d { background: linear-gradient(180deg, rgba(248,113,113,.28), rgba(239,68,68,.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 0 rgba(69,10,10,.6), 0 8px 18px rgba(0,0,0,.25); }
.btn-d:hover { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(2px); filter: brightness(.96); }
.btn-p:active:not(:disabled) { box-shadow: inset 0 1px 0 #fff, 0 1px 0 #4d7c0f, 0 4px 10px rgba(163,230,53,.25); }
.btn-s:active:not(:disabled), .btn-d:active:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 1px 0 rgba(0,0,0,.35); }
/* giriş alanları: içe gömük cam */
.input { background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.12)); border-color: rgba(255,255,255,.14);
  box-shadow: inset 0 2px 5px rgba(0,0,0,.4), inset 0 -1px 0 rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.08); transition: border-color .2s, box-shadow .2s; }
.input:focus { box-shadow: inset 0 2px 5px rgba(0,0,0,.4), 0 0 0 3px rgba(190,242,100,.25), 0 0 18px rgba(190,242,100,.18); }
.seg { box-shadow: inset 0 2px 4px rgba(0,0,0,.35); border-color: rgba(255,255,255,.15); }
.seg input:checked + span { background: linear-gradient(180deg, #2f8550, #1d5534); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.35); }
.seg input.no:checked + span { background: linear-gradient(180deg, #ef4444, #b91c1c); } .seg input.ex:checked + span { background: linear-gradient(180deg, #fbbf24, #d97706); }
/* rozetler, etkinlikler, kort hücreleri */
.badge { background-image: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0)); box-shadow: inset 0 0 0 1px var(--r), inset 0 1px 0 rgba(255,255,255,.2), 0 2px 6px rgba(0,0,0,.2); }
.ev, .cell:not(.c-free) { box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 8px rgba(0,0,0,.22); transition: transform .15s; }
a.ev:hover { transform: translateY(-1px) translateX(1px); }
.table tbody tr { transition: background .15s; } .table tbody tr:hover { background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); }
.note { box-shadow: inset 0 1px 3px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.06); }
.track .fill { box-shadow: 0 0 12px rgba(190,242,100,.5), inset 0 1px 0 rgba(255,255,255,.6); }
.toast { -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 16px 40px rgba(0,0,0,.5); }
.login .card { transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.login .card.tilting { transition: transform .15s ease-out; }
.login .logo { box-shadow: 0 24px 50px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.2), 0 0 40px rgba(190,242,100,.18); }
/* sayfa açılışı: kartlar derinlikten öne gelir */
@keyframes pop3d { from { opacity: 0; transform: perspective(900px) rotateX(14deg) translateY(26px) scale(.97); } }
main.enter .tile, main.enter .card { animation: pop3d .6s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 55ms); transform-origin: 50% 0; }
@media (max-width: 640px) {
  .card { -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); background: linear-gradient(150deg, rgba(255,255,255,.12), rgba(255,255,255,.03) 40%, rgba(6,18,14,.5)), rgba(10,24,19,.5); }
  .table tr { background: linear-gradient(180deg, rgba(255,255,255,.04), transparent); }
}
@media (prefers-reduced-motion: reduce) { main.enter .tile, main.enter .card { animation: none; } .tile, .login .card { transform: none !important; } }
/* =====================================================================
   CAM SEKME ÇUBUKLARI (üst menü: beyaz parlak aktif sekme · sayfa içi: koyu aktif sekme)
   ===================================================================== */
.topbar.glass { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07) 55%, rgba(255,255,255,.1)), rgba(14,28,23,.66);
  border: 1px solid rgba(255,255,255,.26); -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.08), inset 0 0 24px rgba(255,255,255,.05), 0 14px 34px rgba(0,0,0,.42), 0 34px 70px -28px rgba(0,0,0,.75); }
nav.pills { position: relative; padding: 3px; }
nav.pills .pill { position: relative; z-index: 1; color: rgba(255,255,255,.86); border: 0; padding: 8px 14px; transition: color .3s, background .2s; }
nav.pills .pill:hover { background: rgba(255,255,255,.1); color: #fff; transform: none; }
nav.pills .pill.on { color: #0c1714; font-weight: 600; text-shadow: none;
  background: linear-gradient(180deg, #ffffff, #e6ecea); box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.08), 0 0 0 1px rgba(255,255,255,.7), 0 0 0 4px rgba(255,255,255,.12), 0 8px 20px rgba(255,255,255,.18), 0 3px 8px rgba(0,0,0,.3); }
nav.pills.has-ind .pill.on { background: transparent; box-shadow: none; }
nav.pills.has-ind .pill.on:hover { background: transparent; }
.pill-ind { position: absolute; z-index: 0; left: 0; top: 3px; bottom: 3px; width: 0; border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, #ffffff, #e6ecea);
  box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.08), 0 0 0 1px rgba(255,255,255,.7), 0 0 0 4px rgba(255,255,255,.12), 0 8px 22px rgba(255,255,255,.2), 0 3px 8px rgba(0,0,0,.3);
  transition: transform .45s cubic-bezier(.3,1.25,.4,1), width .45s cubic-bezier(.3,1.25,.4,1); }
.brand b { text-shadow: 0 1px 2px rgba(0,0,0,.35); }
/* sayfa içi sekmeler: açık cam ray, koyu aktif sekme */
.tabs { display: inline-flex; max-width: 100%; gap: 2px; padding: 4px; border-radius: 999px; overflow-x: auto; scrollbar-width: none; vertical-align: top;
  background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.2), 0 10px 26px rgba(0,0,0,.32); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.84); white-space: nowrap; transition: background .2s, color .2s; }
.tab:hover { background: rgba(255,255,255,.1); color: #fff; }
.tab.on { color: #fff; font-weight: 600; background: linear-gradient(180deg, #26302d, #0a100e);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.08), 0 6px 14px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.5); }
.tab:focus-visible, nav.pills .pill:focus-visible { outline: 2px solid #d9f99d; outline-offset: 1px; }
/* seçim düğmeleri (yoklama, karne puanı) aynı cam ray görünümünde */
.seg { gap: 2px; padding: 3px; border-radius: 999px; overflow: visible; border: 1px solid rgba(255,255,255,.2);
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 6px 16px rgba(0,0,0,.25); }
.seg span { border-radius: 999px; padding: 5px 12px; transition: background .2s; }
.seg label:hover span { background: rgba(255,255,255,.1); }
.seg input:checked + span { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.35); }
@media (max-width: 640px) { .tab { padding: 7px 13px; } nav.pills .pill { padding: 8px 12px; } }
/* onay penceresi ve kilit */
.modal-bg { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgba(2,8,6,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadeIn .15s ease-out; }
.modal { width: 100%; max-width: 420px; animation: pop3d .3s cubic-bezier(.2,.8,.2,1); background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 40%, rgba(6,18,14,.6)), rgba(10,24,19,.82); }
.modal-ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fde68a; background: linear-gradient(150deg, rgba(251,191,36,.35), rgba(251,191,36,.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
fieldset.lockable { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.locked .input, fieldset.locked .check { opacity: .62; cursor: not-allowed; }
fieldset.locked [type=submit] { display: none; }
.lock-note { margin: 0 0 14px; padding: 9px 12px; border-radius: 10px; font-size: 13px; color: #fde68a; background: rgba(251,191,36,.1); box-shadow: inset 0 0 0 1px rgba(252,211,77,.25); }
/* ---------- yazdırma */
@media print {
  @page { margin: 14mm; }
  .scene, header.top, .noprint, .toast { display: none !important; }
  html:root, html:root body { background: #fff !important; }
  *:not(.pk) { color: #111 !important; background: transparent !important; box-shadow: none !important; text-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .card { border-color: #ddd !important; } main { padding: 0; }
  .ph > .row, .btn { display: none !important; } .grid { display: block !important; } .grid > * + * { margin-top: 12px; }
  .note { border: 1px solid #ddd; } .track .prev { background: #555 !important; box-shadow: none !important; } .pk { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #24663f !important; }
  .printonly { display: block !important; }
  .card::before, .card::after, .tile::before, .tile::after, .glass::before { display: none !important; }
  .tabs, .pill-ind { display: none !important; }
  .card, .tile { transform: none !important; animation: none !important; }
}
.printonly { display: none; }

<script>
  // Ana betik çalışmazsa (eksik yapıştırma, sözdizimi hatası) kullanıcıya nedenini ve teknik ayrıntıyı göster
  window.__ktaErr = [];
  window.addEventListener('error', function (e) { window.__ktaErr.push((e.message || 'Bilinmeyen hata') + (e.lineno ? ' (satır ' + e.lineno + ')' : '')); });
  setTimeout(function () {
    if (window.__ktaReady) return;
    var err = window.__ktaErr.join(' · ');
    var cut = /end of input|Unexpected end|Unterminated|missing \) |Invalid or unexpected token/i.test(err);
    var esc = function (t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    document.getElementById('app').innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;border-radius:14px;background:#45130f;color:#fecaca;font:15px/1.5 system-ui">'
      + '<b>Sistem yüklenemedi.</b><br>'
      + (cut || !err ? 'Index.html dosyası Apps Script\'e <b>eksik</b> yapıştırılmış görünüyor. Dosyayı Not Defteri ile açın, Ctrl+A ve Ctrl+C ile <b>tamamını</b> kopyalayın; Apps Script\'teki Index dosyasında Ctrl+A ile eskisini seçip yapıştırın. Yapıştırdıktan sonra dosyanın en altında <b>&lt;/html&gt;</b> satırı olmalı. Kaydedip Dağıt → Dağıtımları yönet → ✏️ → Yeni sürüm ile yayınlayın.'
        : 'Sayfanın kodu bir hatayla durdu.')
      + (err ? '<div style="margin-top:12px;padding:10px;border-radius:8px;background:rgba(0,0,0,.35);font:12px/1.4 ui-monospace,Consolas,monospace;color:#fde68a">Teknik ayrıntı: ' + esc(err) + '</div><div style="font-size:13px;margin-top:8px">Bu ekranın görüntüsünü destek için gönderebilirsiniz.</div>' : '')
      + '</div>';
  }, 6000);
</script>
